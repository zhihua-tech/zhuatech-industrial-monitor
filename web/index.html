<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华工业设备监控</title><style>:root{font-family:Inter,"PingFang SC",sans-serif;color:#182436;background:#f0f3f5}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:218px 1fr;min-height:100vh}aside{background:#172a34;color:#c6d3d7;padding:25px 17px}.logo{color:white;font-size:19px;font-weight:700}.logo small{display:block;color:#78939b;font-size:11px}.nav{margin-top:34px}.nav div{padding:11px 13px;margin:4px;border-radius:6px}.nav .on{background:#187a83;color:#fff}main{padding:27px 32px}.top{display:flex;justify-content:space-between}.top h1{margin:0;font-size:24px}.muted{color:#7a8795;font-size:13px}.shift{border:1px solid #cfd8dc;border-radius:7px;background:white;padding:8px 12px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:23px 0}.card{background:#fff;border:1px solid #dfe5e8;border-radius:8px;padding:17px}.metric b{display:block;font-size:28px;margin-top:7px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.section h2{font-size:16px;margin:0 0 13px}.asset{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding:14px 0;border-top:1px solid #edf0f2}.running{color:#1b7d61}.signal{display:grid;grid-template-columns:2fr 1fr .7fr;gap:10px;padding:13px 0;border-top:1px solid #edf0f2}.signal strong{font-family:ui-monospace,monospace;font-size:18px}.oee{color:#187a83}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside><div class="logo">知华工业监控<small>INDUSTRIAL OPERATIONS</small></div><div class="nav"><div class="on">生产总览</div><div>设备资产</div><div>实时测点</div><div>告警中心</div><div>停机分析</div><div>维修工单</div><div>OEE 分析</div></div></aside><main><div class="top"><div><h1>冲压一线 · 运行驾驶舱</h1><div class="muted">设备状态、质量码、告警处置与生产效率</div></div><span class="shift">白班 08:00—20:00</span></div><div class="metrics" id="metrics"></div><div class="grid"><section class="card section"><h2>设备状态</h2><div id="assets"></div></section><section class="card section"><h2>实时测点</h2><div id="signals"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const labels={assets:'设备总数',running:'运行设备',alarms:'活动告警',workOrders:'维修工单',oee:'当班 OEE'};metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><b class="${k==='oee'?'oee':''}">${v}${k==='oee'?'%':''}</b></div>`).join('');assets.innerHTML=d.assets.map(x=>`<div class="asset"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.code)} · ${esc(x.line)}</div></div><span>${esc(x.status)}</span><span class="running">● 数据正常</span></div>`).join('');signals.innerHTML=d.signals.map(x=>`<div class="signal"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.code)}</div></div><strong>${x.value??'--'} ${esc(x.unit)}</strong><span class="running">${esc(x.quality||'待采集')}</span></div>`).join('')})</script></body></html>
